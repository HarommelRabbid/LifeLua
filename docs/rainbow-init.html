<script src="rainbow-custom.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll('div.fragment').forEach(function(fragment) {
    // 1. Determine language extension (e.g. from page title or class)
    let lang = 'lua'; 
    const match = fragment.className.match(/lang-(\w+)/);
    if (match) {
      lang = match[1];
    } else if (document.title.toLowerCase().endsWith('.json')) {
      lang = 'json';
    }

    // 2. Extract code from Doxygen's div.line structure
    const lines = fragment.querySelectorAll('div.line');
    let rawCode = '';

    if (lines.length > 0) {
      const lineTexts = [];
      lines.forEach(function(lineEl) {
        // Extract raw text from each line div
        lineTexts.push(lineEl.textContent || lineEl.innerText);
      });
      rawCode = lineTexts.join('\n');
    } else {
      rawCode = fragment.textContent || fragment.innerText;
    }

    // 3. Construct standard pre/code block for Rainbow
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.setAttribute('data-language', lang);
    code.textContent = rawCode;
    pre.appendChild(code);

    // 4. Replace Doxygen's div.fragment with the clean element
    fragment.parentNode.replaceChild(pre, fragment);
  });

  // 5. Highlight all formatted code blocks
  if (window.Rainbow) {
    Rainbow.color();
  }
});
</script>
